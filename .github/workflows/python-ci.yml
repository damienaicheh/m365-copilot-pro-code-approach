name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Test and quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --no-install-project --group dev

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check . ../tests

      - name: Type check
        run: uv run mypy

      - name: Security scan
        run: uv run bandit -r . -q
